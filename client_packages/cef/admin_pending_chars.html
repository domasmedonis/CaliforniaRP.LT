<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Pending Characters</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:;">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 12px;
            font-family: Arial, Helvetica, sans-serif;
            background: rgba(255, 255, 255, 0.02);
        }

        .modal {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal>.modal-header,
        .modal .list {
            box-sizing: border-box
        }

        .modal .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 720px;
            margin-bottom: 8px
        }

        .modal .close-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer
        }

        .modal .list {
            width: 720px;
            max-height: 72vh;
            overflow: auto;
            padding: 12px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35)
        }

        .item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border: 1px solid #e5e5e5;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            background: #fff
        }

        .item .ucp {
            font-size: 12px;
            color: #999;
            margin-left: 6px
        }

        .item-left {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex: 1
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px
        }

        .meta {
            font-size: 12px;
            color: #666;
            margin-top: 4px
        }

        .item-right {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .btn-accept {
            background: #2ecc71
        }

        .btn-reject {
            background: #e74c3c
        }

        button {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: transform .08s ease, box-shadow .08s ease
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12)
        }

        .meta {
            font-size: 12px;
            color: #666
        }

        button {
            padding: 6px 10px;
            border-radius: 6px;
            background: #4caf50;
            border: none;
            color: #fff;
            cursor: pointer
        }

        .btn-reject {
            background: #e74c3c
        }
    </style>
</head>

<body>
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h2>Laukiantys veikėjai</h2>
            <button id="closeBtn" class="close-btn">✕</button>
        </div>
        <div id="list" class="list"></div>
    </div>

    <script>
        // Ensure CEF accepts pointer events and can be focused
        try {
            document.documentElement.style.width = '100%';
            document.documentElement.style.height = '100%';
            document.body.style.width = '100%';
            document.body.style.height = '100%';
            document.body.style.pointerEvents = 'auto';
            document.body.tabIndex = -1;
            document.body.style.zIndex = '999999';
        } catch (e) { }

        function displayPending(list) {
            const data = Array.isArray(list) ? list : [];
            const container = document.getElementById('list');
            container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = '<div>Tuščia</div>'; return; }
            data.forEach((row) => {
                const div = document.createElement('div'); div.className = 'item';
                const left = document.createElement('div'); left.className = 'item-left';
                const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.innerText = ((row.first_name || '?')[0] || '?').toUpperCase();
                const info = document.createElement('div');
                const title = document.createElement('div'); title.innerHTML = `<strong>${row.first_name} ${row.last_name}</strong> <span class="ucp">(${row.ucp_username})</span>`;
                const meta = document.createElement('div'); meta.className = 'meta'; meta.innerText = `Amžius: ${row.age || '-'} | Lytis: ${row.gender || '-'} | Pateikta: ${row.created_at}`;
                const bio = document.createElement('div'); bio.style.margin = '8px 0'; bio.style.fontSize = '13px'; bio.style.color = '#333'; bio.innerText = (row.bio || '').length > 220 ? (row.bio || '').slice(0, 217) + '...' : (row.bio || '');
                info.appendChild(title); info.appendChild(meta); info.appendChild(bio);
                left.appendChild(avatar); left.appendChild(info);
                const right = document.createElement('div'); right.className = 'item-right';
                const btn = document.createElement('button'); btn.className = 'btn-accept'; btn.innerText = 'Patvirtinti';
                btn.onclick = () => {
                    try {
                        btn.disabled = true;
                        btn.innerText = 'Patvirtinama...';
                        if (typeof mp !== 'undefined' && mp && typeof mp.trigger === 'function') mp.trigger('approveCharacter', row.id);
                    } catch (e) { console.error(e); }
                };

                const rej = document.createElement('button'); rej.className = 'btn-reject'; rej.innerText = 'Atmesti';
                rej.onclick = () => {
                    try {
                        // non-blocking inline confirmation UI to avoid browser confirm() freeze
                        btn.style.display = 'none';
                        rej.style.display = 'none';
                        const confirmWrap = document.createElement('div'); confirmWrap.style.display = 'flex'; confirmWrap.style.gap = '8px';
                        const yes = document.createElement('button'); yes.className = 'btn-reject'; yes.innerText = 'Taip';
                        const no = document.createElement('button'); no.className = 'close-btn'; no.innerText = 'Atšaukti';
                        confirmWrap.appendChild(yes); confirmWrap.appendChild(no);
                        right.appendChild(confirmWrap);

                        yes.onclick = () => {
                            try {
                                yes.disabled = true;
                                no.disabled = true;
                                // optimistic UI: remove card immediately to reflect action
                                try { div.style.opacity = '0.4'; } catch (e) { }
                                if (typeof mp !== 'undefined' && mp && typeof mp.trigger === 'function') mp.trigger('rejectCharacter', row.id);
                                // remove element after a short delay to allow server call
                                setTimeout(() => { try { div.remove(); } catch (e) { } }, 300);
                            } catch (e) { console.error(e); }
                        };

                        no.onclick = () => {
                            try { confirmWrap.remove(); btn.style.display = ''; rej.style.display = ''; } catch (e) { console.error(e); }
                        };
                    } catch (e) { console.error(e); }
                };
                right.appendChild(btn); right.appendChild(rej);
                div.appendChild(left); div.appendChild(right);
                container.appendChild(div);
            });
        }

        // Accept either a JSON string or an array
        window.openPending = function (json) {
            try {
                try { document.body.style.pointerEvents = 'auto'; document.body.focus(); } catch (e) { }
                let parsed = json;
                if (typeof json === 'string') parsed = JSON.parse(json);
                if (!Array.isArray(parsed)) parsed = [];
                displayPending(parsed);
            } catch (e) { console.error(e); }
        };

        // debug click logging
        document.addEventListener('click', function (ev) { try { console.log('admin_pending click', ev.target && (ev.target.innerText || ev.target.className)); } catch (e) { } }, true);

        // Inform client script that admin CEF is ready
        try { if (typeof mp !== 'undefined' && mp && typeof mp.trigger === 'function') mp.trigger('adminPendingLoaded'); } catch (e) { }

        // Close button support: call client to destroy the admin browser
        try {
            const close = document.getElementById('closeBtn');
            if (close) close.addEventListener('click', () => { try { if (typeof mp !== 'undefined' && mp && typeof mp.trigger === 'function') mp.trigger('closeAdminPendingUI'); } catch (e) { console.error(e); } });
        } catch (e) { }

        // keep focus to help input
        setInterval(() => { try { document.body.focus(); } catch (e) { } }, 200);
    </script>
</body>

</html>
