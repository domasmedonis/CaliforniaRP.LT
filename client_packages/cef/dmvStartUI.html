<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMV pradzia</title>
    <style>
        :root {
            --panel: #ffffff;
            --soft: #eef8ff;
            --line: rgba(31, 91, 128, 0.16);
            --text: #183244;
            --muted: #657b8d;
            --accent: #18c7d2;
            --accent-2: #3b8cff;
            --shadow: 0 22px 70px rgba(34, 78, 120, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: transparent !important;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .panel {
            width: min(430px, calc(100vw - 48px));
            border: 1px solid var(--line);
            border-radius: 10px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(236, 249, 255, 0.96));
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .head {
            padding: 22px 22px 16px;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.1;
        }

        .sub {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .price {
            margin: 18px 22px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.76);
            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 10px;
            padding: 0 22px 22px;
        }

        button {
            height: 42px;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 900;
            cursor: pointer;
        }

        .primary {
            flex: 1;
            border: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #061014;
        }

        .ghost {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
        }
    </style>
</head>

<body>
    <main class="panel">
        <div class="head">
            <h1>Ar norite laikyti testa?</h1>
            <div class="sub">Patvirtinus bus nuskaiciuotas DMV testo mokestis.</div>
        </div>
        <div class="price">Kaina: $500</div>
        <div class="actions">
            <button class="ghost" onclick="closeDMVStart()">Ne</button>
            <button class="primary" onclick="startDMVTest()">Taip, pradeti</button>
        </div>
    </main>

    <script>
        function startDMVTest() {
            mp.trigger('startDMVTest');
        }

        function closeDMVStart() {
            mp.trigger('closeDMVStart');
        }
    </script>
</body>

</html>
